server:
  port: 8090

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/bar_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    # La secret key debe configurarse via variable de entorno JWT_SECRET_KEY
    # En desarrollo, usar el perfil 'dev' que tiene un valor por defecto
    expiration-time: ${JWT_EXPIRATION_TIME:3600000}

logging:
  level:
    root: INFO
    com.app.projectbar: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:dev-only-secret-key-change-before-production-use}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
